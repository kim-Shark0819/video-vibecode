# 보안 헤더 정책값을 변수에 담아 둔다.
# add_header 를 location 마다 다시 써야 하는데(아래 설명), 같은 긴 문자열을 세 번 쓰면
# 한 곳만 고치고 나머지를 잊는 사고가 난다. map 은 http 컨텍스트에서 동작하고
# 이 파일은 conf.d/*.conf 로 include 되므로 유효하다.
#
# img-src: 표지·콘티·참조 이미지는 전부 S3 presigned URL 로 온다.
#   app/src/server.py 의 presign() 은 boto3 기본값을 쓰므로 virtual-hosted 형식이다
#   (버킷명에 점이 없어 auto -> virtual-hosted). 두 버킷의 호스트를 고정한다.
#   'self' 만 두면 앱의 모든 이미지가 차단된다.
#
#   호스트가 **원본 계정의 버킷**을 가리키고 있었다. Report-Only 라서 차단되지는
#   않았지만, 그 상태로 강제 모드로 바꾸면 이미지가 전부 막힌다.
#
#   병합 시점 정리: Base 는 원본 계정의 버킷을, Overlay 는 자기 계정의 버킷을 가리키고
#   있었다. **양쪽 다 이 계정 값이 아니다.** 이 계정의 버킷으로 고쳤다 —
#   config.env 의 S3_BUCKET 과 같은 값이어야 한다.
#
#   TODO(후속): 버킷명이 여기 하드코딩되어 있다(PRD H7 는 변수화를 요구한다).
#   이 파일은 frontend/Dockerfile 이 직접 COPY 하므로 deploy/render.py 의 .tmpl 경로
#   밖에 있다. 템플릿화하려면 빌드 컨텍스트를 함께 바꿔야 해서 Phase 1 범위를 넘긴다.
#   S3_BUCKET 을 바꿀 때 이 줄도 함께 고칠 것.
#
#   vpoc1(2026-09-23): 영상은 us-west-2 버킷(whynot-video-730335451955-us-west-2)에서
#   presigned GET 으로 재생하고, 캐릭터 이미지와 업로드 썸네일은 주 버킷
#   (whynot-730335451955, ap-northeast-2)에서 온다. 두 호스트를 img-src·media-src 에 넣는다.
#   재생은 <video src> 태그라 media-src 가 적용된다. fetch 로 읽지 않으므로 connect-src 는
#   'self' 로 둔다.
map $host $toon_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://ai-poc-730335451955.s3.ap-northeast-2.amazonaws.com https://whynot-730335451955.s3.ap-northeast-2.amazonaws.com https://whynot-video-730335451955-us-west-2.s3.us-west-2.amazonaws.com https://*.fal.media; media-src 'self' blob: https://whynot-730335451955.s3.ap-northeast-2.amazonaws.com https://whynot-video-730335451955-us-west-2.s3.us-west-2.amazonaws.com; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # 응답에 charset 을 명시한다.
    #
    # 없으면 Content-Type 이 `text/html` / `application/javascript` 로만 나간다.
    # 문서는 <meta charset> 이 있어 살아나지만, app.js 는 자체 선언이 없어서 문서의
    # 인코딩을 물려받는 방식에 의존한다. app.js 에는 화면에 보이는 한국어 문자열이
    # 많아서 이 의존이 깨지면 UI 전체가 깨진 글자로 보인다. HTTP 클라이언트도
    # charset 이 없으면 ISO-8859-1 로 디코딩한다(실측: PowerShell 이 그랬다).
    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;

    # ─────────────────────────────────────────────────────────────────────────
    # 보안 헤더
    #
    # 주의: nginx 의 add_header 는 상속이 "전부 아니면 전무"다.
    #       하위 블록이 add_header 를 하나라도 선언하면 상위 블록의 add_header 가
    #       전부 사라진다. 전에는 아래 location 두 개가 Cache-Control 을 선언하는 바람에
    #       여기 있는 다섯 개가 브라우저에 하나도 전달되지 않았다.
    #       (배포본 실측: 응답에 CSP·X-Frame-Options 등이 전무했다)
    #
    #       그래서 add_header 를 쓰는 location 마다 같은 목록을 다시 쓴다.
    #       중복이지만 nginx 에서는 이것이 정석이다.
    #
    # CSP 는 우선 Report-Only 로 내보낸다. 위반이 0건인 것을 실측한 뒤
    # Content-Security-Policy 로 이름만 바꿔 강제한다.
    # 곧바로 강제하면 img-src 를 잘못 잡았을 때 앱의 모든 이미지가 사라진다.
    # ─────────────────────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only $toon_csp always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"toon-change-ai-pj-frontend"}';
    }

    # 정적 자산은 URL에 빌드 버전(?v=)이 붙으므로 오래 캐시해도 안전하다.
    # 배포마다 URL이 바뀌어 이전 파일이 재사용되지 않는다.
    #
    # woff2가 빠져 있었다. 그대로 두면 2MB 폰트를 매 방문 다시 받는다.
    # 폰트는 버전 쿼리 없이 파일명으로만 식별되므로, 폰트를 교체할 때는 파일명을 바꾼다.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
        # `expires 30d;` 를 쓰지 않는다. 그 지시어가 Cache-Control 을 스스로 만들어,
        # 아래 add_header 와 합쳐져 헤더가 두 번 실렸다. 실제 응답이 이랬다.
        #
        #   Cache-Control: max-age=2592000,public, max-age=2592000, immutable
        #
        # 브라우저는 첫 값을 읽어 동작하지만 그 값에는 immutable 이 없다. 즉 의도한
        # "재검증 없이 쓴다"가 적용되지 않고, 중간 프록시 구현에 따라 해석이 갈린다.
        # add_header 하나로 통일한다(Expires 헤더는 HTTP/1.1 에서 필요하지 않다).
        add_header Cache-Control "public, max-age=2592000, immutable" always;

        # 위 server 블록의 add_header 를 다시 쓴다. 빠뜨리면 이 경로의 응답에서
        # 보안 헤더가 통째로 사라진다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $toon_csp always;

        try_files $uri =404;
    }

    # HTML은 절대 캐시하지 않는다. 캐시되면 새 배포에서도 이전 자산 URL을 계속 참조한다.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;

        # 같은 이유로 다시 쓴다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $toon_csp always;

        try_files $uri $uri/ /index.html;
    }
}
