<?xml version="1.0" encoding="UTF-8"?>
<!--
  와이낫미디어 브랜드 로고 — WHYNOT 워드마크 (흰색)

  logo.svg 와 같은 도형이고 fill 만 흰색이다. 쓰이는 자리는 주황 상자 안이다:
  로그인(.brand-light)과 사이드바(.sidebar .app-brand). 상자는 styles.css 끝부분의
  .brand-logo-surface 가 브랜드 토큰(#ef4f23)으로 칠한다. 근거는 와이낫미디어_로고.png
  의 락업 — 주황 배경에 흰 워드마크.

  주의: XML 주석에는 하이픈 두 개를 연달아 쓸 수 없다. CSS 사용자 정의 속성 이름을
  그대로 적으면 파일이 파싱되지 않고 로고가 아예 안 보인다. 그래서 여기서는
  토큰 이름 대신 값을 적는다.

  ## 왜 파일을 둘로 나눴나
  <img> 로 불러오는 SVG 는 별개 문서라 페이지의 CSS 가 닿지 않는다. fill 을
  currentColor 로 두고 자리마다 색을 바꾸는 방법이 통하지 않는다. mask-image 로
  우회할 수는 있지만 <img> 의 width/height 와 대체 텍스트를 잃는다.
  그래서 흰 워드마크와 주황 워드마크를 각각 파일로 둔다.
  도형을 고칠 때는 두 파일을 함께 고친다 — path 와 transform 이 동일해야 한다.

  ## 규격
  viewBox 339x64 로 logo.svg 와 같다. 마크업·CSS 를 건드리지 않으려면 이 값을 지킨다.
  원본 워드마크의 잉크 영역은 299.570 x 40.461 (7.4039:1) 이라 가로를 꽉 채우고
  (scale 1.131622) 남는 위아래를 반씩 나눠 세로 가운데에 둔다(y +9.054667).

  ## 대비
  흰 워드마크 대 브랜드 주황(#ef4f23) = 3.61:1. 비텍스트 마크 기준 3:1 을 넘는다.
  상자 색을 바꿀 때 이 값을 다시 재야 한다. 3:1 아래로 내려가면 로고가 배경에 묻는다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 339 64" width="339" height="64"
     role="img" aria-label="WHYNOT">
  <title>WHYNOT</title>
  <g transform="translate(-0.028291 9.054667) scale(1.131622) translate(48.872 -90.24)"
     fill="#ffffff" fill-rule="nonzero">
