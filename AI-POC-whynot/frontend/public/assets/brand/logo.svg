<?xml version="1.0" encoding="UTF-8"?>
<!--
  와이낫미디어 브랜드 로고 — WHYNOT 워드마크

  출처: 와이낫미디어_로고_2.svg (고객 제공). 그 파일에서 글자 윤곽(단일 path)만 가져왔다.
  글자는 W H Y N O T 여섯 자이고 O 의 안쪽 구멍까지 7개 서브패스로 되어 있다.

  ## viewBox 를 339x64 로 유지하는 이유
  이 값이 자리표시자와 같아서 마크업(index.html 4곳)과 CSS(.brand-logo* 규칙)를
  건드리지 않고 파일 교체만으로 로그인 · 모바일 · 사이드바 · 상단 경로가 함께 바뀐다.

  원본 워드마크의 실제 잉크 영역은 299.570 x 40.461 (7.4039:1) 이고 339x64 (5.297:1) 보다
  납작하다. 그래서 가로를 꽉 채우도록 맞추고(scale 1.131622 -> 339 x 45.787)
  남는 위아래 18.213 을 반씩 나눠 세로 가운데에 둔다(y +9.054667).
  숫자는 눈으로 고르지 않았다. 베지어를 41분할로 평탄화해 잉크 bbox 를 실측한 값이다.
  아래 g 의 transform 은 오른쪽부터 적용된다 — 원본의 translate(48.872 -90.24) 로
  좌상단을 원점에 붙인 뒤, 확대하고, 세로 중앙으로 내린다.

  ## 색과 쓰이는 자리
  #ef4f23 — 와이낫미디어_로고.png 의 배경색을 실제로 샘플링한 값이다(1200x630 에서
  최빈색). 원본 SVG 는 #fa4616 이었는데 두 주황이 섞이지 않게 PNG 쪽으로 통일했다.
  둘 다 흰 배경에서 3:1 을 넘긴다(3.53 / 3.61). 원본에 있던 fill-opacity:.980392 는
  Inkscape 의 알파 슬라이더 흔적이라 떼어냈다.

  이 주황 워드마크는 **흰 배경 위에만** 쓴다.
      상단 경로 topbar    #ffffff(반투명)  3.61:1
      모바일 로그인 패널   #ffffff          3.61:1

  주황 배경 위에는 흰 워드마크(logo-white.svg)를 쓴다. 로그인과 사이드바가 그쪽이다.
  도형을 고칠 때는 두 파일을 함께 고친다 — path 와 transform 이 동일해야 한다.

  로고 색을 바꿀 때는 놓이는 배경에서 3:1 을 다시 잰다. 한쪽만 보고 정하면
  반대쪽에서 사라진다.

  ## 주의
  페이지의 styles.css 는 이 파일에 적용되지 않는다. <img> 로 불러오는 SVG 는 별개 문서라
  전역 `svg { fill: none; stroke: currentColor }` 규칙이 닿지 않는다. 그래서 fill 을
  이 파일 안에 직접 적는다. 여기서 fill 을 지우면 로고가 검게 나온다.

  캐시 무효화는 index.html 의 ?v=__ASSET_VERSION__ 가 처리한다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 339 64" width="339" height="64"
     role="img" aria-label="WHYNOT">
  <title>WHYNOT</title>
  <g transform="translate(-0.028291 9.054667) scale(1.131622) translate(48.872 -90.24)"
     fill="#ef4f23" fill-rule="nonzero">
