<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vpoc1 테스트 영상 (dev 전용)</title>
  <!-- Gate 1 전용 페이지. 앱 화면 없이 Luma Ray2 경로만 끝까지 확인한다.
       VPOC_SMOKE_ENABLED 가 켜진 배포에서만 서버가 답한다. 1단계가 끝나도 dev 에 남긴다.
       인라인 스크립트를 쓰지 않는다 — CSP script-src 'self' 를 지킨다. -->
  <link rel="stylesheet" href="/vpoc.css?v=__ASSET_VERSION__">
</head>
<body class="vpoc-smoke-body">
  <main class="vpoc-smoke">
    <h1>vpoc1 테스트 영상</h1>
    <p class="vpoc-smoke-note">
      Luma Ray2 로 5초 · 540p · 16:9 무음 영상 1건을 만들어 재생합니다.
      한 건에 3.75 USD가 듭니다(비용 상한은 없고 누적만 기록합니다). 보통 2~5분 걸립니다.
    </p>
    <p class="vpoc-smoke-note" id="smokeAuth"></p>
    <div class="vpoc-smoke-actions">
      <button type="button" id="smokeRun" class="vpoc-btn vpoc-btn-primary">테스트 영상 만들기</button>
      <button type="button" id="smokeFail" class="vpoc-btn">AWS 오류 원문 시험 (과금 없음)</button>
    </div>
    <p class="vpoc-progress" id="smokeStatus"></p>
    <pre class="vpoc-error" id="smokeError" hidden></pre>
    <video id="smokeVideo" class="vpoc-smoke-video" controls muted playsinline hidden></video>
    <details class="vpoc-smoke-prompt">
      <summary>보낸 프롬프트</summary>
      <pre id="smokePrompt"></pre>
    </details>
  </main>
  <script src="/vpoc-smoke.js?v=__ASSET_VERSION__"></script>
</body>
</html>
